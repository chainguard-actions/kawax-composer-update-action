name: Test with composer files present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create minimal composer.json and composer.lock in workspace
        run: |
          # Write a minimal composer.json with no dependencies so composer update
          # completes quickly and produces no changes (early exit path)
          cat > "$GITHUB_WORKSPACE/composer.json" << 'EOF'
          {
              "name": "test/project",
              "description": "Test project for composer-update-action",
              "require": {},
              "require-dev": {}
          }
          EOF

          # Write a matching minimal composer.lock
          cat > "$GITHUB_WORKSPACE/composer.lock" << 'EOF'
          {
              "_readme": [
                  "This file is @generated automatically"
              ],
              "content-hash": "d751713988987e9331980363e24189ce",
              "packages": [],
              "packages-dev": [],
              "aliases": [],
              "minimum-stability": "stable",
              "stability-flags": [],
              "prefer-stable": false,
              "prefer-lowest": false,
              "platform": {},
              "platform-dev": {},
              "plugin-api-version": "2.6.0"
          }
          EOF

          echo "composer.json and composer.lock created"
          ls -la "$GITHUB_WORKSPACE/composer.json" "$GITHUB_WORKSPACE/composer.lock"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: refs/heads/act-harness
          COMPOSER_PATH: ""
          GIT_NAME: "Composer Update Bot"
          GIT_EMAIL: "bot@example.com"

      - name: Assert action ran with composer files present
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "Action outcome: $OUTCOME"
          # With an empty composer.json (no deps), composer update produces no changes.
          # The action should exit with "No changes after update." (success)
          # or fail at the GitHub API stage if something unexpected happens.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with composer files and produced a deterministic outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
