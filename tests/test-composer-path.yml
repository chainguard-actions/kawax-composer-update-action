name: Test COMPOSER_PATH env var
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal composer.json in subdirectory
        run: |
          mkdir -p subdir
          cat > subdir/composer.json <<'EOF'
          {
            "name": "test/project",
            "require": {}
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: fake-token-for-testing
          GIT_NAME: Test User
          GIT_EMAIL: test@example.com
          COMPOSER_PATH: /github/workspace/subdir

      - name: Assert action ran with COMPOSER_PATH set
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because the GitHub token is fake,
          # but it should not be skipped — it should have run.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with COMPOSER_PATH (outcome: ${{ steps.action.outcome }})"
