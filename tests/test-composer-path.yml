name: Test COMPOSER_PATH env var
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: dummy-token-for-testing
      COMPOSER_PATH: /subdir
      GIT_NAME: test-user
      GIT_EMAIL: test@example.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal composer.json in subdirectory
        run: |
          mkdir -p subdir
          cat > subdir/composer.json <<'EOF'
          {
            "name": "test/subdir-project",
            "description": "Test project in subdirectory",
            "require": {}
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action ran with COMPOSER_PATH set
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with a dummy token since it cannot
          # authenticate to GitHub to create a pull request. We verify it ran
          # (outcome is 'failure' or 'success', not 'skipped').
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with COMPOSER_PATH (outcome=${{ steps.action.outcome }})"
