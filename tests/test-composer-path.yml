name: Test COMPOSER_PATH subdirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal composer.json in subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/subdir"
          cat > "$GITHUB_WORKSPACE/subdir/composer.json" <<'EOF'
          {
            "name": "test/subdir-project",
            "description": "Test project in subdirectory",
            "require": {},
            "config": {
              "platform": {
                "php": "8.2.0"
              }
            }
          }
          EOF

      - name: Run composer update action with COMPOSER_PATH (expect failure without real token)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: fake-token-for-testing
          COMPOSER_PATH: /subdir
          GIT_NAME: test-user
          GIT_EMAIL: test@example.com

      - name: Assert action ran with COMPOSER_PATH
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without a real GitHub token
          # but it should fail due to API errors, not setup/container errors.
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran with COMPOSER_PATH and produced a deterministic outcome"
          else
            echo "FAIL: unexpected outcome '${{ steps.action.outcome }}'"
            exit 1
          fi
