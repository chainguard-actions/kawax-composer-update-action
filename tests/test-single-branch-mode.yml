name: Test single-branch mode (APP_SINGLE_BRANCH)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Remove composer files to trigger early exit
        run: |
          rm -f "$GITHUB_WORKSPACE/composer.json" "$GITHUB_WORKSPACE/composer.lock"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: refs/heads/act-harness
          COMPOSER_PATH: ""
          APP_SINGLE_BRANCH: "true"
          APP_SINGLE_BRANCH_POSTFIX: "-updated"
          GIT_NAME: "Composer Update Bot"
          GIT_EMAIL: "bot@example.com"

      - name: Assert action ran in single-branch mode
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "Action outcome: $OUTCOME"
          # In single-branch mode the branch name is deterministic (parent-updated)
          # The action should run init(), detect no composer.json, and exit early
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in single-branch mode and produced a deterministic outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
