name: Test - no composer files (early exit)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no composer.json in workspace root
        run: |
          # Make sure there's no composer.json at the workspace root
          # so the action takes the early-exit path (exists() returns false)
          rm -f "$GITHUB_WORKSPACE/composer.json" "$GITHUB_WORKSPACE/composer.lock"
          echo "Workspace contents:"
          ls -la "$GITHUB_WORKSPACE"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: refs/heads/act-harness
          GIT_NAME: test-bot
          GIT_EMAIL: test-bot@example.com
          # Allow git to operate on the mounted workspace inside the Docker container
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"

      - name: Assert action completed (early exit when no composer files)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should exit cleanly (exit 0) when composer.json/composer.lock
          # are not present — it returns early from the handle() method.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited cleanly with no composer files"
          else
            echo "FAIL: action did not exit cleanly (outcome=$OUTCOME)"
            exit 1
          fi
