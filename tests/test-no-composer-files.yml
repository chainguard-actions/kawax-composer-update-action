name: Test no composer files (early exit)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Remove any composer files from workspace root to trigger early exit
        run: |
          rm -f "$GITHUB_WORKSPACE/composer.json" "$GITHUB_WORKSPACE/composer.lock"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: refs/heads/act-harness
          COMPOSER_PATH: ""

      - name: Assert action ran (early exit due to missing composer files is acceptable)
        run: |
          # The action should either:
          # 1. Exit 0 after detecting no composer.json (early exit path)
          # 2. Exit with an error related to GitHub API (no real PR target)
          # In either case, the Docker container must have started and run
          OUTCOME="${{ steps.action.outcome }}"
          echo "Action outcome: $OUTCOME"
          # We accept success (early exit) or failure (API error after git ops)
          # The key is the action ran and didn't crash the runner itself
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a deterministic outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
