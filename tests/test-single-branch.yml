name: Test single branch mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal composer.json in workspace
        run: |
          cat > "$GITHUB_WORKSPACE/composer.json" <<'EOF'
          {
            "name": "test/project",
            "description": "Test project for single branch mode",
            "require": {},
            "config": {
              "platform": {
                "php": "8.2.0"
              }
            }
          }
          EOF

      - name: Run composer update action in single-branch mode (expect failure without real token)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: fake-token-for-testing
          GIT_NAME: test-user
          GIT_EMAIL: test@example.com
          APP_SINGLE_BRANCH: "1"
          APP_SINGLE_BRANCH_POSTFIX: "-updated"
          GIT_COMMIT_PREFIX: "[UPDATE] "

      - name: Assert action ran in single-branch mode
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without a real GitHub token
          # but it should fail due to API errors, not setup/container errors.
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran in single-branch mode and produced a deterministic outcome"
          else
            echo "FAIL: unexpected outcome '${{ steps.action.outcome }}'"
            exit 1
          fi
