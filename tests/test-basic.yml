name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GIT_NAME: test-user
      GIT_EMAIL: test@example.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal composer.json in workspace
        run: |
          cat > composer.json <<'EOF'
          {
            "name": "test/project",
            "description": "Test project",
            "require": {}
          }
          EOF

      - name: Run composer update action
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: fake-token-for-testing
          GIT_NAME: test-user
          GIT_EMAIL: test@example.com

      - name: Assert action ran (Docker image built and container started)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to either succeed (no deps to update)
          # or fail at the GitHub API step (fake token), not at Docker build.
          # Either outcome means the Docker image built and the entrypoint ran.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=${{ steps.action.outcome }})"
