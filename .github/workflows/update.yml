name: composer update

on:
  push:
#    branches:
#      - master
  #    - v*
  schedule:
    - cron: '0 4 * * *' #UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  composer_update_job:
    runs-on: ubuntu-latest
    name: composer update
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: composer update action
        uses: kawax/composer-update-action@691851bcfb369d5ac85cef34ca420be64949a94c # master
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}
          COMPOSER_PATH: /update
          GIT_NAME: kawax
          GIT_EMAIL: kawaxbiz@gmail.com
